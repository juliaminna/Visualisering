<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="dotgrid.css" />
  </head>
  <body>

    <main>
      <div class="container pb-4">
        <div class="row">
          <div class="col-12 col-lg-6 py-2 py-lg-3">
            <div class="card rounded-4 shadow-sm">
              <div class="card-body">
                <h2 class="h2">Skärmtid i livet</h2>
                <form action="#">
                  <div class="col d-flex">
                    <div class="col-12">

                    <label for="range4" class="form-label h6">Din ålder:</label>
                        <output for="range4" id="rangeValueAge" aria-hidden="true"></output>
                        <input id="ageOfUser" type="range" class="form-range" min="18" max="83" value="18">

                    <label for="range4" class="form-label h6">Din skärmtid per dag:</label>
                        <output for="range5" id="rangeValueTime" aria-hidden="true"></output>
                        <input id="screenTime" type="range" class="form-range" min="0" max="24" step="0.5" value="0">
                </form>
              </div>
            </div>
          </div>
        </div>
          <div class="flip-card rounded-4 shadow-sm" id="myCard">
              <div class="flip-card-inner">
                <div class="flip-card-front">
                  <div id="dotGrid"></div>
                <div class="flip-card-back">
                  <h1>John Doe</h1>
                  <p>Architect & Engineer</p>
                  <p>We love that guy</p>
                </div>
              </div>
            </div>
            <button class="flip-btn btn btn-secondary" id="flipBtn">Läs mer</button>
          </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js" type="module"></script>
  </body>
</html>
