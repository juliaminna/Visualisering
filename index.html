<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>

    <main>
             <div class="container startpage-cards pb-4">
        <div class="row">
          <div class="col-12 col-lg-6 py-2 py-lg-3">
            <div class="card rounded-4 shadow-sm">
              <div class="card-body">
                <h2 class="h2">Search vacation</h2>
                <form action="#">
                  <div class="col d-flex">
                    <div class="col-12">
                      <input
                        class="form-control"
                        style="background-color: #edf3f5; margin-top: 40px"
                        type="Text"
                        id="ageOfUser"
                        placeholder="FROM: YOUR CURRENT LOCATION"/>
                    </div>
                  </div>
                  <div class="col d-flex">
                    <div class="col-12">
                      <input
                        class="form-control"
                        style="text-transform: uppercase; margin-top: 20px"
                        list="datalistOptions"
                        id="screenTime"
                        placeholder=" To: Destination..."
                      />
                    </div>
                  </div>
                  <datalist id="datalistOptions"> </datalist>
                  <a
                    href="#"
                    id="searchBtn"
                    class="a-btn d-flex justify-content-center bg-col shadow-sm col-12 rounded-3"
                    style="
                      padding: 10px;
                      margin-top: 40px;
                      border-color: #b9dee9;
                      border-style: solid;
                    "
                    >Search</a
                  >
                </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js" type="module"></script>
  </body>
</html>
